[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-tray"
version = "1.1.0"
description = "Your Claude Code 5-hour usage window, live in the system tray. Two icons, no window, no overlay."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Svatka Technologies™ (Alex Merovic)" }]
keywords = ["claude", "claude-code", "anthropic", "usage", "system-tray", "rate-limit"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: Freeware",
  "License :: Other/Proprietary License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = [
  "pystray>=0.19",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/alexmerovic/claude-tray"
Issues = "https://github.com/alexmerovic/claude-tray/issues"

# Dois launchers de proposito: `claude-tray` abre console (status, autostart,
# --debug) e `claude-trayw` nao abre nenhum - e esse que o autostart registra.
# Sem o gui-script, todo logon piscaria um console preto na tela.
[project.scripts]
claude-tray = "claude_tray.cli:main"

[project.gui-scripts]
claude-trayw = "claude_tray.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_tray"]
